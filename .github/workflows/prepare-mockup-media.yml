name: Prepare Original Mockup Media
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/prepare-mockup-assets.py"
      - ".github/workflows/prepare-mockup-media.yml"
permissions:
  contents: write
jobs:
  download-source-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install media libraries
        run: python -m pip install --quiet pillow cairosvg
      - name: Fetch verified mockup image URLs and official Font Awesome Free icons
        run: python scripts/prepare-mockup-assets.py
      - name: Commit originals and media-library-ready files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/uploads-ready/photos assets/uploads-ready/icons assets/icons
          if ! git diff --cached --quiet; then
            git commit -m "assets: download mockup photos and exact Font Awesome shapes [skip ci]"
            git push origin HEAD:main
          fi

name: Validate WordPress Theme
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -eu
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Verify theme and uploadable media
        run: |
          set -eu
          test -f style.css
          test -f front-page.php
          test -f page.php
          test -f assets/css/ameza.css
          test -f assets/css/admin.css
          test -f assets/js/ameza.js
          test -f assets/uploads-ready/photos/hero.jpg
          test -f assets/uploads-ready/photos/production.jpg
          test -f assets/uploads-ready/photos/product.jpg
          test -f assets/uploads-ready/icons/phone.png
          test -f assets/icons/phone.svg
          if grep -R -n 'images.unsplash.com\|cdnjs.cloudflare.com/ajax/libs/font-awesome' --include='*.php' --include='*.css' .; then
            echo 'Found external image / Font Awesome CSS dependency'
            exit 1
          fi

name: Validate WordPress Theme
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP syntax
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Check external stock images and embedded JS
        run: |
          set -e
          if grep -R -n 'images.unsplash.com\|cdnjs.cloudflare.com/ajax/libs/font-awesome' --include='*.php' --include='*.css' .; then
            echo "External image/font icon dependencies found"
            exit 1
          fi
          test -f assets/css/ameza.css
          test -f assets/js/ameza.js
          test -f assets/img/hero-socks.svg
          test -f assets/icons/phone.svg

  export-uploadable-images:
    if: github.event_name == 'push'
    needs: php-lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert SVG illustrations to uploadable PNG
        run: |
          python -m pip install --quiet cairosvg
          python scripts/export-images.py
      - name: Commit PNG files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/uploads-ready/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: export local upload-ready PNG illustrations [skip ci]"
            git push origin HEAD:main
          fi
